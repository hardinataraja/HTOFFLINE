<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SinyalLokal - Walkie Talkie QR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tactical: {
                            900: '#111810',
                            800: '#1b261b',
                            700: '#2d3f2d',
                            600: '#415a41',
                            500: '#587e58',
                            400: '#a3b19b',
                            accent: '#4ade80'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Library QR Code Generator & Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111810; -webkit-tap-highlight-color: transparent; }
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glow-green { box-shadow: 0 0 15px rgba(74, 222, 128, 0.4); }
        .glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .ptt-active {
            transform: scale(0.95);
            background: radial-gradient(circle, #22c55e 0%, #15803d 100%) !important;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.8), inset 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-gray-200 overflow-hidden select-none">

    <div class="relative w-full h-screen max-w-md bg-tactical-900 flex flex-col justify-between shadow-2xl overflow-hidden border border-tactical-800 md:h-[850px] md:rounded-3xl">
        
        <!-- Header -->
        <header class="p-5 border-b border-tactical-800 bg-tactical-800/50 flex justify-between items-center z-10">
            <div>
                <h1 class="text-xs tracking-widest text-tactical-accent font-semibold font-digital uppercase">SinyalLokal QR</h1>
                <p class="text-[10px] text-gray-400">P2P Walkie-Talkie Offline</p>
            </div>
            <div class="flex items-center space-x-2">
                <span id="statusLed" class="w-3 h-3 rounded-full bg-red-500 animate-pulse glow-red"></span>
                <span id="connectionStatus" class="text-xs font-semibold uppercase text-red-500 font-digital">Terputus</span>
            </div>
        </header>

        <!-- Layar LCD Taktis -->
        <main class="flex-1 flex flex-col justify-start p-5 space-y-4 overflow-y-auto">
            
            <div class="bg-black/40 border border-tactical-800 p-4 rounded-xl flex flex-col justify-center items-center relative">
                <div class="w-full flex justify-between text-[10px] text-tactical-400 font-semibold uppercase mb-1">
                    <span>Sinyal Radio Lokal</span>
                    <span>Mode QR Scanner (Low Density)</span>
                </div>
                <div class="text-2xl font-bold font-digital text-tactical-accent tracking-widest py-1 glow-green">
                    CH-QR.SCAN <span class="text-sm">P2P</span>
                </div>
                <div class="w-full h-4 mt-1 flex items-center justify-center">
                    <canvas id="visualizer" class="w-full h-full opacity-60"></canvas>
                </div>
            </div>

            <!-- Area Interaksi Utama Koneksi -->
            <div class="bg-tactical-800/20 p-4 rounded-xl border border-tactical-800 space-y-4 flex-1 flex flex-col justify-between">
                
                <!-- Skenario Tombol Aksi -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnInitOffer" class="bg-tactical-700 hover:bg-tactical-600 p-3 rounded-xl border border-tactical-500 text-xs text-tactical-accent font-digital font-semibold text-center">
                        1. BUAT UNDANGAN (QR)
                    </button>
                    <button id="btnStartScan" class="bg-tactical-600/50 hover:bg-tactical-600 p-3 rounded-xl border border-tactical-500 text-xs text-white font-digital font-semibold text-center">
                        2. PINDAI QR PASANGAN
                    </button>
                </div>

                <!-- Wadah Dinamis untuk QR Code Generator / Scanner Kamera -->
                <div class="flex-1 min-h-[180px] bg-black/40 rounded-xl border border-tactical-800 flex flex-col items-center justify-center p-2 relative overflow-hidden">
                    
                    <!-- Tampilan QR Code yang Digenerate (Sengaja diberi padding putih lebar agar kontras tinggi) -->
                    <div id="qrcodeContainer" class="hidden p-4 bg-white rounded-xl shadow-inner"></div>
                    
                    <!-- Tampilan Kamera Scanner -->
                    <div id="scannerContainer" class="hidden w-full h-full rounded-lg overflow-hidden"></div>
                    
                    <!-- Placeholder awal -->
                    <div id="placeholderText" class="text-xs text-center text-gray-500 max-w-[200px]">
                        Klik salah satu tombol di atas untuk memulai jabat tangan offline.
                    </div>
                </div>

                <!-- Penampung Token Tersembunyi -->
                <input type="hidden" id="localToken">
                <input type="hidden" id="remoteToken">

                <!-- Tombol Eksekusi Final -->
                <button id="btnConnectFinal" class="hidden w-full bg-tactical-accent hover:bg-green-400 text-tactical-900 font-bold py-3 rounded-xl text-xs font-digital transition-all shadow-lg">
                    SAMBUNGKAN KONEKSI (FINAL)
                </button>
            </div>

        </main>

        <!-- Area Transmisi Suara -->
        <footer class="p-6 bg-tactical-800/80 border-t border-tactical-700 rounded-t-3xl flex flex-col items-center justify-center space-y-4">
            
            <div class="flex items-center space-x-3 mb-1">
                <label class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Mode Open Mic (Handsfree)</label>
                <button id="btnHandsfree" class="w-10 h-6 bg-tactical-700 rounded-full p-1 transition-colors duration-300">
                    <div id="handsfreeIndicator" class="w-4 h-4 bg-gray-400 rounded-full transition-transform duration-300"></div>
                </button>
            </div>

            <div class="relative flex items-center justify-center">
                <span id="pttPing" class="absolute inline-flex h-24 w-24 rounded-full bg-tactical-accent/20 opacity-0 transition-all duration-300"></span>
                <button id="btnPtt" disabled class="relative w-24 h-24 rounded-full bg-gradient-to-b from-tactical-700 to-tactical-800 border-4 border-tactical-600 flex flex-col justify-center items-center shadow-lg active:scale-95 disabled:opacity-30">
                    <svg id="pttMicIcon" class="w-8 h-8 text-tactical-accent mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                    <span id="pttText" class="text-[9px] font-digital font-bold text-tactical-accent tracking-wider">TALK LOCK</span>
                </button>
            </div>
            <p id="footerHint" class="text-[10px] text-gray-400 text-center">Gunakan pemindai QR untuk menghubungkan perangkat.</p>
        </footer>
    </div>

    <audio id="remoteAudio" autoplay class="hidden"></audio>

    <!-- JavaScript Logika QR & WebRTC -->
    <script>
        let localStream, peerConnection, isHandsfree = false, isTransmitting = false;
        let audioContext, analyser, dataArray, animationId;
        let qrScanner = null;
        let isOfferCreator = false;

        const peerConfiguration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // DOM Elements
        const btnPtt = document.getElementById('btnPtt');
        const pttPing = document.getElementById('pttPing');
        const pttText = document.getElementById('pttText');
        const pttMicIcon = document.getElementById('pttMicIcon');
        const statusLed = document.getElementById('statusLed');
        const connectionStatus = document.getElementById('connectionStatus');
        const visualizer = document.getElementById('visualizer');
        const canvasCtx = visualizer.getContext('2d');
        const remoteAudio = document.getElementById('remoteAudio');

        const qrcodeContainer = document.getElementById('qrcodeContainer');
        const scannerContainer = document.getElementById('scannerContainer');
        const placeholderText = document.getElementById('placeholderText');
        const btnConnectFinal = document.getElementById('btnConnectFinal');

        // --- ALGORITMA PENYUSUTAN DATA SDP (MUNGING) ---
        // Menghapus data-data non-esensial agar ukuran teks menyusut 70% sehingga QR Code sangat renggang & gampang di-scan
        function minifySDP(sdp) {
            return sdp.split('\n')
                .map(line => line.trim())
                .filter(line => {
                    // Hanya izinkan baris kritis WebRTC
                    if (line.startsWith('a=candidate:')) {
                        // Hanya pertahankan jalur IPv4 UDP (Buang jalur IPv6 dan TCP yang sangat panjang)
                        return line.includes(' udp ') && !line.includes(':') && (line.includes('typ host') || line.includes('typ srflx'));
                    }
                    // Buang baris meta feedback audio tambahan yang tidak terlalu penting
                    if (line.startsWith('a=extmap:') || line.startsWith('a=rtcp-fb:') || line.startsWith('a=rtcp-mux') || line.startsWith('a=msid')) {
                        return false;
                    }
                    return line.length > 0;
                })
                .join('\n');
        }

        // Setup Audio Mic
        async function setupAudio() {
            if (localStream) return true;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                initVisualizer(localStream);
                return true;
            } catch (err) {
                alert("Aplikasi membutuhkan izin mikrofon!");
                return false;
            }
        }

        // Init WebRTC
        function initPeerConnection() {
            peerConnection = new RTCPeerConnection(peerConfiguration);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                    updateUiConnected();
                }
            };

            // Menangkap kandidat ICE baru jika ada pembaruan jalur secara real-time
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && peerConnection.localDescription) {
                    const minified = minifySDP(peerConnection.localDescription.sdp);
                    const localDescWithNewIce = {
                        type: peerConnection.localDescription.type,
                        sdp: minified
                    };
                    const updatedToken = btoa(JSON.stringify(localDescWithNewIce));
                    document.getElementById('localToken').value = updatedToken;
                    
                    if (!qrcodeContainer.classList.contains('hidden')) {
                        generateQrCodeVisual(updatedToken);
                    }
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') updateUiConnected();
                if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') updateUiDisconnected();
            };
        }

        // Helper untuk membuat QR Code ke layar
        function generateQrCodeVisual(textData) {
            qrcodeContainer.innerHTML = "";
            new QRCode(qrcodeContainer, {
                text: textData,
                width: 190, // Perbesar sedikit ukurannya agar mudah di-scan
                height: 190,
                correctLevel: QRCode.CorrectLevel.L // Low error correction = titik pixel jauh lebih besar dan sedikit
            });
        }

        // Aksi 1 - Membuat Undangan (Offer) QR secara INSTAN (Sudah Diringkas)
        document.getElementById('btnInitOffer').addEventListener('click', async () => {
            const hasAudio = await setupAudio();
            if (!hasAudio) return;

            isOfferCreator = true;
            placeholderText.innerText = "Membuka jalur sinyal nirkabel...";
            
            initPeerConnection();

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            // Ringkas data SDP penawaran
            const minifiedSdp = minifySDP(offer.sdp);
            const rawDescription = { type: 'offer', sdp: minifiedSdp };
            const base64Token = btoa(JSON.stringify(rawDescription));
            
            document.getElementById('localToken').value = base64Token;
            generateQrCodeVisual(base64Token);
            
            placeholderText.classList.add('hidden');
            scannerContainer.classList.add('hidden');
            qrcodeContainer.classList.remove('hidden');
        });

        // Aksi 2: Membuka Kamera Scanner QR Code
        document.getElementById('btnStartScan').addEventListener('click', async () => {
            const hasAudio = await setupAudio();
            if (!hasAudio) return;

            placeholderText.classList.add('hidden');
            qrcodeContainer.classList.add('hidden');
            scannerContainer.classList.remove('hidden');

            if(!qrScanner) {
                qrScanner = new Html5Qrcode("scannerContainer");
            }

            qrScanner.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 220, height: 220 } }, // Area fokus pemindaian yang ideal
                async (decodedText) => {
                    qrScanner.stop().then(() => {
                        qrScanner = null;
                        document.getElementById('remoteToken').value = decodedText;
                        processScannedToken(decodedText);
                    });
                },
                (errorMessage) => { /* Abaikan kegagalan frame pembacaan */ }
            ).catch(err => alert("Kamera gagal diakses. Berikan izin akses kamera pada HP Anda terlebih dahulu."));
        });

        // Pemrosesan Token Hasil Scan QR
        async function processScannedToken(tokenBase64) {
            try {
                const parsedSdp = JSON.parse(atob(tokenBase64));

                if (!isOfferCreator) {
                    // Skenario Orang Kedua (Penerima QR Pertama)
                    initPeerConnection();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(parsedSdp));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    // Ringkas data SDP jawaban Orang Kedua
                    const minifiedSdp = minifySDP(answer.sdp);
                    const rawDescription = { type: 'answer', sdp: minifiedSdp };
                    const base64Answer = btoa(JSON.stringify(rawDescription));
                    
                    document.getElementById('localToken').value = base64Answer;
                    generateQrCodeVisual(base64Answer);

                    qrcodeContainer.classList.remove('hidden');
                    scannerContainer.classList.add('hidden');
                    
                    placeholderText.className = "text-[11px] text-center text-tactical-accent font-semibold p-1 mt-1";
                    placeholderText.innerText = "SUKSES MEMBACA! Sekarang tunjukkan balik QR Code di atas ke pasangan Anda.";
                    placeholderText.classList.remove('hidden');
                } else {
                    // Skenario Orang Pertama (Menerima QR Balasan dari Orang Kedua)
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(parsedSdp));
                    
                    qrcodeContainer.classList.add('hidden');
                    btnConnectFinal.classList.remove('hidden');
                    
                    placeholderText.className = "text-xs text-center text-green-400 font-semibold p-1";
                    placeholderText.innerText = "Jalur jabat tangan cocok! Klik tombol di bawah untuk membuka koneksi.";
                    placeholderText.classList.remove('hidden');
                }
            } catch (e) {
                alert("Gagal memproses kode QR. Silakan muat ulang halaman dan coba lagi.");
                location.reload();
            }
        }

        // Tombol Hubungkan Akhir (Untuk Orang Pertama)
        btnConnectFinal.addEventListener('click', () => {
            btnConnectFinal.classList.add('hidden');
            placeholderText.innerText = "Menyambungkan sinyal nirkabel lokal...";
        });

        // Kontrol UI Terhubung / Terputus
        function updateUiConnected() {
            statusLed.className = "w-3 h-3 rounded-full bg-tactical-accent animate-pulse glow-green";
            connectionStatus.innerText = "TERHUBUNG";
            connectionStatus.className = "text-xs font-semibold text-tactical-accent font-digital";
            btnPtt.disabled = false;
            footerHint.innerText = isHandsfree ? "OPEN MIC AKTIF" : "TEKAN & TAHAN UNTUK BICARA";
            placeholderText.innerText = "Komunikasi suara P2P aktif.";
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function updateUiDisconnected() {
            statusLed.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse glow-red";
            connectionStatus.innerText = "TERPUTUS";
            connectionStatus.className = "text-xs font-semibold text-red-500 font-digital";
            btnPtt.disabled = true;
            footerHint.innerText = "Gunakan pemindai QR untuk menghubungkan perangkat.";
        }

        // Logika Push To Talk (PTT)
        function setMuteState(mute) {
            if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !mute);
        }
        setTimeout(() => setMuteState(true), 1000);

        function startTransmission() {
            if (isTransmitting || btnPtt.disabled) return;
            isTransmitting = true;
            setMuteState(false);
            btnPtt.classList.add('ptt-active');
            pttPing.classList.add('animate-ping', 'opacity-100');
            pttText.innerText = "ON AIR";
            pttText.className = "text-[9px] font-digital font-bold text-red-500 tracking-wider";
            pttMicIcon.className = "w-8 h-8 text-red-500 mb-1";
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function stopTransmission() {
            if (!isTransmitting || isHandsfree) return;
            isTransmitting = false;
            setMuteState(true);
            btnPtt.classList.remove('ptt-active');
            pttPing.classList.remove('animate-ping', 'opacity-100');
            pttText.innerText = "TALK LOCK";
            pttText.className = "text-[9px] font-digital font-bold text-tactical-accent tracking-wider";
            pttMicIcon.className = "w-8 h-8 text-tactical-accent mb-1";
        }

        // PTT Event Listeners
        btnPtt.addEventListener('mousedown', startTransmission);
        btnPtt.addEventListener('mouseup', stopTransmission);
        btnPtt.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmission(); });
        btnPtt.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmission(); });

        // Handsfree Mode Toggle
        btnHandsfree.addEventListener('click', () => {
            if(btnPtt.disabled) return;
            isHandsfree = !isHandsfree;
            if (isHandsfree) {
                btnHandsfree.classList.replace('bg-tactical-700', 'bg-tactical-accent');
                handsfreeIndicator.classList.add('translate-x-4');
                startTransmission();
                pttText.innerText = "OPEN MIC";
            } else {
                btnHandsfree.classList.replace('bg-tactical-accent', 'bg-tactical-700');
                handsfreeIndicator.classList.remove('translate-x-4');
                isTransmitting = false;
                stopTransmission();
            }
        });

        // Audio Visualizer Function
        function initVisualizer(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 32;
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawVisualizer();
        }

        function drawVisualizer() {
            animationId = requestAnimationFrame(drawVisualizer);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            const width = visualizer.width = visualizer.clientWidth;
            const height = visualizer.height = visualizer.clientHeight;
            canvasCtx.clearRect(0, 0, width, height);
            const barWidth = width / dataArray.length;
            let barHeight, x = 0;
            for (let i = 0; i < dataArray.length; i++) {
                barHeight = isTransmitting ? dataArray[i] / 2 : dataArray[i] / 6;
                canvasCtx.fillStyle = isTransmitting ? '#4ade80' : '#2d3f2d';
                canvasCtx.fillRect(x, (height - barHeight)/2, barWidth - 2, barHeight);
                x += barWidth;
            }
        }
    </script>
</body>
</html>
